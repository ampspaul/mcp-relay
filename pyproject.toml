[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-relay"
version = "0.1.0"
description = "A secure MCP relay/gateway that proxies tool calls to remote MCP servers with authentication, secret resolution, and security controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MCP Relay Contributors" },
]
keywords = ["mcp", "relay", "gateway", "llm", "tools", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

# Core dependencies required for basic operation (FR-19)
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# GCP Secret Manager backend (FR-05)
gcp = [
    "google-cloud-secret-manager>=2.20.0",
]

# AWS Secrets Manager backend (FR-06)
aws = [
    "boto3>=1.34.0",
]

# Azure Key Vault backend (FR-07)
azure = [
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
]

# HashiCorp Vault backend (FR-08)
vault = [
    "hvac>=2.1.0",
]

# All secret backends combined
all-secrets = [
    "google-cloud-secret-manager>=2.20.0",
    "boto3>=1.34.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    "hvac>=2.1.0",
]

# Development and testing dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
mcp-relay = "mcp_relay.main:build_app"

[project.urls]
Homepage = "https://github.com/example/mcp-relay"
Repository = "https://github.com/example/mcp-relay"
Issues = "https://github.com/example/mcp-relay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_relay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
